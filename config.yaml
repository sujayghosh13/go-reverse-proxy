port: 8080
health_check_interval_seconds: 5
circuit_breaker_threshold: 3
circuit_breaker_cooldown_seconds: 5
log_level: "INFO"
log_json: true
cache_enabled: true
cache_ttl_seconds: 30
read_timeout_seconds: 10
write_timeout_seconds: 10
max_body_bytes: 10485760
backends:
  - localhost:9001
  - localhost:9002
  - localhost:9003
