apiVersion: v1
kind: ConfigMap
metadata:
  name: reverse-proxy-config
  labels:
    app: reverse-proxy
data:
  config.yaml: |
    port: 8080
    health_check_interval_seconds: 5
    circuit_breaker_threshold: 3
    circuit_breaker_cooldown_seconds: 5
    log_level: "INFO"
    log_json: true
    cache_enabled: true
    cache_ttl_seconds: 30
    read_timeout_seconds: 10
    write_timeout_seconds: 10
    max_body_bytes: 10485760
    backends:
      - backend-service:9001
      - backend-service:9002
      - backend-service:9003
